services:
  vexto-download:
    build: .
    image: vexto-download-gateway:local
    container_name: vexto-download-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:18768:18768"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18768/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
