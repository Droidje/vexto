plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.vexto.engine'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '28.2.13676358'

    defaultConfig {
        minSdk 28
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        consumerProguardFiles 'consumer-rules.pro'
        if (!providers.gradleProperty('vextoSkipNative').isPresent()) {
            externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_static' } }
        }
    }

    // Runtime sources/headers are prepared offline by scripts; no build-time downloads.
    if (!providers.gradleProperty('vextoSkipNative').isPresent()) {
        externalNativeBuild { cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version providers.gradleProperty('vextoCmakeVersion').orElse('3.22.1').get()
        } }
    }
    ndkVersion '28.2.13676358'
    if (providers.gradleProperty('vextoNdkPath').isPresent()) {
        ndkPath providers.gradleProperty('vextoNdkPath').get()
    }
    sourceSets { main {
        // Explicit source roots keep the legacy multi-GB embedded pack out of quality APKs.
        assets.srcDirs = ['src/main/quality-assets', 'src/main/punctuation-assets', 'src/main/overlap-assets', "$rootDir/tools/native/licenses"]
    } }

    packaging { jniLibs { useLegacyPackaging = true } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // scripts/fetch_models.sh помещает проверенный AAR в локальный Maven-репозиторий.
    api 'com.k2fsa:sherpa-onnx:2.0.1'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'

    testImplementation 'junit:junit:4.13.2'
}

// Fail before packaging a default build with silently missing recognizers.
tasks.register('verifyQualityRuntime') {
    onlyIf { !providers.gradleProperty('vextoSkipNative').isPresent() }
    doLast {
        android.defaultConfig.ndk.abiFilters.each { abi ->
            ['libvexto_nemotron_exec.so', 'libvexto_whisper_exec.so', 'libvexto_llama_exec.so',
             'libnemo_speech_asr.so', 'libnemo_speech_asr_c.so'].each { name ->
                if (!file("src/main/jniLibs/$abi/$name").isFile()) {
                    throw new GradleException("Missing quality native runtime $abi/$name; run scripts/build_native_runtime.py (engine/README.md)")
                }
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyQualityRuntime' }

// A native APK must contain the ready-to-run corrector, including its tokenizer.
tasks.register('verifyPunctuationModels') {
    onlyIf { !providers.gradleProperty('vextoSkipNative').isPresent() }
    doLast {
        exec { commandLine 'python3', "$rootDir/scripts/prepare_punctuation_models.py", '--verify-only' }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyPunctuationModels' }

tasks.register('verifyOverlapModels') {
    onlyIf { !providers.gradleProperty('vextoSkipNative').isPresent() }
    doLast {
        exec { commandLine 'python3', "$rootDir/scripts/verify_overlap_model.py" }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyOverlapModels' }
