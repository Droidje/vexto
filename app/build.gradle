plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.vexto.reflect'
    compileSdk 35
    buildToolsVersion '35.0.0'

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.vexto.reflect'
        minSdk 28
        targetSdk 35
        versionCode providers.gradleProperty('vextoVersionCode').orElse('1').get().toInteger()
        versionName '0.5.0'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging { jniLibs { useLegacyPackaging = true } }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED',
                    '--add-opens=java.base/java.net=ALL-UNNAMED',
                    '--add-opens=java.base/java.security=ALL-UNNAMED',
                    '--add-opens=java.base/java.text=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                    '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                    '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
        }
    }

    androidResources {
        // The offline engine checks asset sizes through AssetManager.openFd.
        noCompress 'onnx', 'txt', 'json'
    }
}

dependencies {
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'androidx.core:core:1.15.0'
    implementation project(':engine')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
