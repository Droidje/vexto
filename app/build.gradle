plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vexto.reflect'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.vexto.reflect'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    // Модели движка лежат в assets и копируются в filesDir без распаковки
    androidResources {
        noCompress 'onnx', 'txt', 'json'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'androidx.core:core:1.15.0'
    implementation project(':engine')
}
