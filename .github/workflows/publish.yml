name: Publish

# Пайплайн 3 — только после слияния в main: сборка и публикация образов
# в GitHub Packages (ghcr.io). Пушей в main без слияния быть не должно —
# ветка принимает только смерженные PR из dev.
# Примечание: приложение планируется Android (артефакт — APK/AAB); образ здесь
# — контейнер сборки и будущие серверные компоненты. При появлении реальных
# сервисов заменить Dockerfile-заглушку на настоящие сборки.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-publish:
    name: Билд и публикация образов в ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Имя образа в нижнем регистре (ghcr требует lowercase)
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Логин в ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
