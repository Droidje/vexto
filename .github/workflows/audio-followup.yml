name: Short offline audio integration
on:
  workflow_call:
    inputs:
      native_base_run:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      native_base_run:
        description: Successful native APK job whose unchanged backends may be reused
        type: string
        default: '42374748971'
permissions:
  contents: read
  actions: read
jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Reserve space on disposable hosted runner
        run: |
          sudo -E python3 - <<'PY'
          import os, shutil, sys
          from pathlib import Path
          assert sys.platform == 'linux' and os.environ.get('GITHUB_ACTIONS') == 'true'
          assert os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
          for name in ('/usr/share/dotnet', '/opt/ghc', '/usr/local/.ghcup', '/opt/hostedtoolcache/CodeQL'):
              path = Path(name)
              if path.is_dir() and not path.is_symlink(): shutil.rmtree(path)
          PY
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg ninja-build
          python3 -m pip install cmake==3.31.6
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - uses: actions/download-artifact@v8
        with:
          name: unsigned-apk
          path: unsigned
          run-id: ${{ inputs.native_base_run }}
          github-token: ${{ github.token }}
      - name: Validate reused backend provenance
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RUN: ${{ inputs.native_base_run }}
        run: python3 tools/benchmarks/validate_native_reuse.py "$BASE_RUN"
      - name: Prepare pinned models and current native code
        env:
          VEXTO_NEMOTRON_ONLY: '1'
        run: |
          bash scripts/prepare_release_models.sh "$RUNNER_TEMP/audio-followup"
          bash tools/benchmarks/prepare_followup_runtime.sh "$ANDROID_HOME/ndk/28.2.13676358" "$RUNNER_TEMP/audio-followup" unsigned/app-release-unsigned.apk
          bash gradlew --no-daemon --max-workers=2 -PvextoSkipNative :app:assembleDebug
      - name: Retain provenance and release build dependencies
        run: |
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /mnt/vexto-audio-followup
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          work = Path(os.environ['RUNNER_TEMP']).resolve() / 'audio-followup'
          assert work.is_dir() and work.parent == Path(os.environ['RUNNER_TEMP']).resolve()
          output = Path('.agents/work/audio-build-provenance'); output.mkdir(parents=True)
          for folder in ('current-native/x86_64', 'current-native/arm64-v8a', 'current-avx2/x86_64'):
              shutil.copy2(work / folder / 'runtime-manifest.json', output / (folder.replace('/', '-') + '.json'))
          for path in work.iterdir():
              if path.name in ('pack', 'extra-whisper'): continue
              if path.is_symlink() or path.is_file(): path.unlink()
              elif path.is_dir(): shutil.rmtree(path)
          sdk = Path(os.environ['ANDROID_HOME']).resolve()
          assert sdk.as_posix().endswith('/android/sdk')
          shutil.rmtree(sdk / 'ndk/28.2.13676358')
          target = Path('/mnt/vexto-audio-followup')
          target.mkdir(exist_ok=True)
          if shutil.disk_usage(target).free < 12 * 1024**3: raise RuntimeError('Need 12GiB before creating an 8GiB disposable AVD')
          link = Path.home() / '.android/avd'; link.parent.mkdir(exist_ok=True)
          if link.exists():
              if link.is_symlink() or any(link.iterdir()): raise RuntimeError('Existing AVD directory is not empty')
              link.rmdir()
          link.symlink_to(target, target_is_directory=True)
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          avd-name: vexto-followup
          ram-size: 4096M
          cores: 4
          disk-size: 8G
          emulator-boot-timeout: 180
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 4096 -cores 4 -partition-size 8192 -no-metrics -accel on
          script: python3 tools/benchmarks/run_audio_followup.py --apk app/build/outputs/apk/debug/app-debug.apk --pack-root "${{ runner.temp }}/audio-followup/pack" --extra-whisper "${{ runner.temp }}/audio-followup/extra-whisper" --output .agents/work/audio-followup-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: short-offline-audio-results
          path: |
            .agents/work/audio-followup-results/**/*.json
            .agents/work/audio-followup-results/**/*.stdout
            .agents/work/audio-followup-results/**/*.stderr
            .agents/work/audio-build-provenance/*.json
          if-no-files-found: ignore
          retention-days: 7
