name: Publish versioned Android package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  mirror:
    if: startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download and verify the signed APK set
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern vexto.apk --pattern 'vexto-models-*.apk' --pattern SHA256SUMS
          cd dist
          test -f vexto.apk && test -f vexto-models-1.apk && test -f vexto-models-2.apk && test -f vexto-models-3.apk
          sha256sum --strict -c SHA256SUMS
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          certificate=""
          for apk in vexto.apk vexto-models-{1,2,3}.apk; do
            proof=$("$build_tools/apksigner" verify --print-certs "$apk")
            current=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<<"$proof")
            test -n "$current"
            [[ -z "$certificate" || "$current" == "$certificate" ]]
            certificate=$current
          done
      - name: Publish the installable set to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          package="ghcr.io/${GITHUB_REPOSITORY,,}-android"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$package:$TAG" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" -f - dist <<'DOCKERFILE'
          FROM scratch
          COPY vexto.apk SHA256SUMS /
          COPY vexto-models-1.apk /
          COPY vexto-models-2.apk /
          COPY vexto-models-3.apk /
          DOCKERFILE
          docker push "$package:$TAG"
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" == "$TAG" ]]; then
            docker tag "$package:$TAG" "$package:latest"
            docker push "$package:latest"
          fi
