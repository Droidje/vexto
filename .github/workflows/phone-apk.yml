name: Build phone installer

on:
  workflow_dispatch:
    inputs:
      base_run:
        description: Successful Android CI/CD run for the current main source tree
        type: string
        required: true
      model_release:
        description: Release with all three verified model split APKs
        type: string
        required: true
        default: v0.5.1

permissions:
  actions: read
  contents: read

jobs:
  phone-apk:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download verified base and release models
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RUN: ${{ inputs.base_run }}
          MODEL_RELEASE: ${{ inputs.model_release }}
        run: |
          [[ "$BASE_RUN" =~ ^[0-9]+$ ]]
          [[ "$MODEL_RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == "refs/tags/$MODEL_RELEASE" ]]
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BASE_RUN")
          base=$(jq -er --arg repo "$GITHUB_REPOSITORY" '
            select(.conclusion == "success" and .path == ".github/workflows/ci.yml"
              and .head_repository.full_name == $repo)
            | .head_sha
          ' <<<"$run")
          [[ "$base" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$base" "$GITHUB_SHA"
          git diff --quiet "$base" "$GITHUB_SHA"
          gh run download "$BASE_RUN" --name unsigned-apk --dir base
          mkdir models
          gh release download "$MODEL_RELEASE" --dir models \
            --pattern 'vexto-models-*.apk' --pattern SHA256SUMS
          (cd models && grep -E '^[a-f0-9]{64}  vexto-models-[123]\.apk$' SHA256SUMS | sha256sum --strict -c -)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
      - name: Build and sign one APK
        env:
          VEXTO_KEYSTORE: ${{ secrets.VEXTO_ANDROID_KEYSTORE }}
          VEXTO_KEYSTORE_PASSWORD: ${{ secrets.VEXTO_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          : "${VEXTO_KEYSTORE:?Missing VEXTO_ANDROID_KEYSTORE}"
          keystore=$(mktemp)
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$VEXTO_KEYSTORE" | base64 --decode > "$keystore"
          python3 scripts/build_phone_apk.py --base-apk base/app-release-unsigned.apk \
            --split models/vexto-models-1.apk --split models/vexto-models-2.apk \
            --split models/vexto-models-3.apk --output dist/vexto-offline.apk \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" --keystore "$keystore"
          sha256sum dist/vexto-offline.apk >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        id: installer
        with:
          path: dist/vexto-offline.apk
          archive: false
          retention-days: 3
          if-no-files-found: error
      - name: Show phone download link
        env:
          DOWNLOAD_URL: ${{ steps.installer.outputs.artifact-url }}
        run: printf '[Download vexto-offline.apk](%s)\n' "$DOWNLOAD_URL" >> "$GITHUB_STEP_SUMMARY"
