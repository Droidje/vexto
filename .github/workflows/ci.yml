name: CI

# Пайплайн 1 — обычные проверки на ветке dev.
# Запускается на PR в dev и на push в dev. Если коммиты уже прошли CI на PR,
# то после слияния в dev тот же прогон не повторяется (job gate это видит и
# пропускает smoke/test). Прямые пуши в dev (без PR) проверяются полностью.
# Примечание: rebase-слияние создаёт новые SHA, поэтому после него прогон
# повторится корректно; merge- и squash-слияния распознаются по сообщению коммита.

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Дедуп — не повторять прогон после слияния
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.dedup.outputs.skip }}
    steps:
      - name: Проверить, что эти коммиты уже проверялись на PR
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then exit 0; fi
          PR=$(printf '%s\n' "$MSG" | grep -oE 'Merge pull request #[0-9]+' | grep -oE '[0-9]+' | head -1)
          [ -z "$PR" ] && PR=$(printf '%s\n' "$MSG" | grep -oE '\(#[0-9]+\)$' | grep -oE '[0-9]+' | tail -1)
          if [ -z "$PR" ]; then
            echo "Прямой пуш в dev (без PR) — проверяем полностью"
            exit 0
          fi
          HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .head.sha)
          echo "Это слияние PR #${PR} (head ${HEAD_SHA}) — ищу успешный прогон CI на этом коммите"
          OK=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.name=="CI" and .conclusion=="success")] | length')
          if [ "${OK:-0}" -ge 1 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CI уже успешно проходил для PR #${PR} — пропускаем повторный прогон"
          else
            echo "Зелёного CI-прогона на head PR не нашлось — проверяем"
          fi

  smoke:
    name: Smoke — целостность репозитория
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Базовые файлы на месте
        run: |
          test -f README.md
          echo "OK: базовые файлы репозитория на месте"

  test:
    name: Autotests — локальное приложение и утилиты
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Unit-тесты утилит
        run: python -m unittest discover -s tools/benchmarks/tests -v
      - name: Синтаксис Android memory guard
        run: bash -n tools/benchmarks/android_memory_guard.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: AAR без весов моделей
        run: bash scripts/fetch_models.sh --aar-only
      - name: JVM-тесты движка, локальной базы и сборка APK
        run: ./gradlew --no-daemon --max-workers=2 :engine:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug
