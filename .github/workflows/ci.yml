name: Android CI/CD

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      optimization_probe:
        description: Build native variants and run short public audio on an isolated 4GB AVD
        type: boolean
        default: false
      native_base_run:
        description: Optional previous successful native APK job; rebuild only the current Nemotron frontend for probes
        type: string
        default: ''
      precision_types:
        description: Comma separated experimental precisions (f32,f16,q8_0)
        type: string
        default: 'f32,q8_0'
      audio_integration:
        description: Run short native contracts and complete offline APK smoke on a disposable 4GB AVD
        type: boolean
        default: false

permissions:
  contents: read

env:
  ANDROID_BUILD_TOOLS: 35.0.0

jobs:
  audio-integration:
    if: inputs.audio_integration
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/audio-followup.yml
    with:
      native_base_run: ${{ inputs.native_base_run }}
  checks:
    name: Python and Android checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Benchmark tests and script syntax
        run: |
          python -m unittest discover -s tools/benchmarks/tests -v
          python -m unittest discover -s ops/apk-download-gateway -p 'test_*.py' -v
          bash -n tools/benchmarks/android_memory_guard.sh
          bash -n scripts/prepare_android_runtime.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK and pinned Java dependency
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;$ANDROID_BUILD_TOOLS"
          bash scripts/fetch_models.sh --aar-only
      - name: JVM tests, lint and Android compile
        run: |
          bash gradlew --no-daemon --max-workers=2 -PvextoSkipNative=true \
            :engine:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Save test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            engine/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  apk:
    name: Full Android APK (ARM64 and x86_64)
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main' || (inputs.optimization_probe && inputs.native_base_run == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;$ANDROID_BUILD_TOOLS" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install host CMake and build pinned native runtime
        env:
          VEXTO_NATIVE_JOBS: 3
        run: |
          python -m pip install cmake==3.31.6
          bash scripts/prepare_android_runtime.sh "$ANDROID_HOME/ndk/28.2.13676358" "$RUNNER_TEMP/vexto-native"
      - name: Assemble release APK
        run: |
          bash gradlew --no-daemon --max-workers=2 -PvextoVersionCode="$((1000 + GITHUB_RUN_NUMBER))" :app:assembleRelease
          python3 scripts/verify_android_apk.py app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3
      - name: Save native build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-build-logs
          path: ${{ runner.temp }}/vexto-native/build.*/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Sign and publish APK
    needs: [checks, apk]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: vexto-android-publish
      queue: max
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: unsigned-apk
          path: unsigned
      - name: Sign and verify installable APK
        env:
          VEXTO_KEYSTORE: ${{ secrets.VEXTO_ANDROID_KEYSTORE }}
          VEXTO_KEYSTORE_PASSWORD: ${{ secrets.VEXTO_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          : "${VEXTO_KEYSTORE:?Missing VEXTO_ANDROID_KEYSTORE}"
          : "${VEXTO_KEYSTORE_PASSWORD:?Missing VEXTO_ANDROID_KEYSTORE_PASSWORD}"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;$ANDROID_BUILD_TOOLS"
          build_tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          keystore="$(mktemp)"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$VEXTO_KEYSTORE" | base64 --decode > "$keystore"
          mkdir dist
          "$build_tools/zipalign" -P 16 -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign --ks "$keystore" --ks-key-alias vexto \
            --ks-pass env:VEXTO_KEYSTORE_PASSWORD --out dist/vexto.apk "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" verify --verbose --print-certs dist/vexto.apk
          "$build_tools/zipalign" -c -P 16 4 dist/vexto.apk
          rm -f dist/vexto.apk.idsig
          (cd dist && sha256sum vexto.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: signed-apk
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Publish to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="ghcr.io/${GITHUB_REPOSITORY,,}-android"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$package:$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" -f - dist <<'DOCKERFILE'
          FROM scratch
          COPY vexto.apk SHA256SUMS /
          DOCKERFILE
          docker push "$package:$GITHUB_SHA"
          docker pull "$package:$GITHUB_SHA"
          container="$(docker create "$package:$GITHUB_SHA" /unused)"
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/vexto.apk" "$RUNNER_TEMP/package.apk"
          cmp dist/vexto.apk "$RUNNER_TEMP/package.apk"

          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]; then
            docker tag "$package:$GITHUB_SHA" "$package:nightly"
            docker push "$package:nightly"
          fi
          printf 'Published %s:%s\n' "$package" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  optimization-probe:
    name: Short Nemotron precision probe (Android 4GB)
    if: always() && inputs.optimization_probe && (needs.apk.result == 'success' || inputs.native_base_run != '')
    needs: apk
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: unsigned-apk
          path: unsigned
          run-id: ${{ inputs.native_base_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Validate reused native dependencies
        if: inputs.native_base_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RUN: ${{ inputs.native_base_run }}
        run: python3 tools/benchmarks/validate_native_reuse.py "$BASE_RUN"
      - name: Prepare pinned precision variants
        env:
          VEXTO_NEMOTRON_ONLY: '1'
        run: bash scripts/prepare_release_models.sh "$RUNNER_TEMP/precision"
      - name: Install pinned frontend compiler
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Compile probe frontend and retire conversion dependencies
        run: |
          python3 tools/benchmarks/probe_nemotron_precision.py --apk unsigned/app-release-unsigned.apk --models "$RUNNER_TEMP/precision/converted/nemotron" --output .agents/work/precision-results --rebuild-frontend --prepare-native-only
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          work = Path(os.environ['RUNNER_TEMP']) / 'precision'
          # All remaining probe code is stdlib; retain weights + conversion manifests.
          for path in work.iterdir():
              if path.name in ('converted', 'requirements.txt'): continue
              if path.is_dir(): shutil.rmtree(path)
              else: path.unlink()
          ndk = Path(os.environ['ANDROID_HOME']) / 'ndk/28.2.13676358'
          shutil.rmtree(ndk)
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Place disposable AVD on scratch disk
        run: |
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /mnt/vexto-precision-avd
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          target = Path('/mnt/vexto-precision-avd')
          if shutil.disk_usage(target).free < 7 * 1024**3:
              raise RuntimeError('Need 7GiB free for disposable Pixel + system image')
          link = Path.home() / '.android/avd'
          link.parent.mkdir(exist_ok=True)
          if link.exists():
              if link.is_symlink() or any(link.iterdir()):
                  raise RuntimeError('Refusing to replace an existing AVD directory')
              link.rmdir()
          link.symlink_to(target, target_is_directory=True)
          PY
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        env:
          VEXTO_PROBE_PRECISIONS: ${{ inputs.precision_types }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          ram-size: 4096M
          cores: 4
          disk-size: 4G
          emulator-boot-timeout: 180
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 4096 -cores 4 -no-metrics -accel on
          script: python3 tools/benchmarks/probe_nemotron_precision.py --apk unsigned/app-release-unsigned.apk --models "${{ runner.temp }}/precision/converted/nemotron" --output .agents/work/precision-results --prepared-native --compare-threads --natural-clip
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: short-precision-results
          path: |
            .agents/work/precision-results/*.json
            .agents/work/precision-results/*.rttm
            .agents/work/precision-results/*.stderr
          if-no-files-found: ignore
          retention-days: 7
