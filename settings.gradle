pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven { url = uri("$rootDir/engine/libs") }
            }
            filter { includeModule('com.k2fsa', 'sherpa-onnx') }
        }
    }
}

rootProject.name = 'Vexto'
include ':app'
include ':engine'
